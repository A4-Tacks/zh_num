[package]
name = "zh_num"
version = "0.4.8"
edition = "2021"
license = "MIT"
authors = ["A4-Tacks <wdsjxhno1001@163.com>"]

description = "Convert ASCII numbers and zh words"
keywords = ["zh", "number", "number-to-words"]
repository = "https://github.com/A4-Tacks/zh_num"
readme = "./README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["std"]
parser = ["peg"]
std = []
bin = ["parser", "std", "getopts-macro", "getopts-macro/std"]

[[bin]]
name = "zh_num"
path = "./src/main.rs"
required-features = ["bin"]

[profile.release]
lto = true
strip = true

[dependencies]
peg = { version = "0.8.3", optional = true }
getopts-macro = { version = "0.1.10", optional = true }
